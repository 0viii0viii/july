name: Release

# v로 시작하는 태그를 push하면 (예: v0.1.0) macOS/Windows 설치파일을 빌드해
# GitHub Release로 공개한다. 태그 하나로 빌드부터 공개까지 끝난다.
#
# 빌드하는 동안에는 초안으로 둔다. 두 플랫폼이 같은 릴리스에 따로 올라오기
# 때문에, 처음부터 공개해두면 한쪽만 올라간 반쪽짜리 릴리스가 사용자와
# 자동 업데이터에 먼저 노출된다. 둘 다 성공하면 마지막 publish 잡이 공개로
# 뒤집는다. 한쪽이 깨지면 초안으로 남으니 확인하고 직접 공개하면 된다.
on:
  push:
    tags:
      - 'v*'
  # 태그를 달기 전에 빌드가 되는지만 보고 싶을 때 수동으로 돌린다.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      # 한쪽 플랫폼이 깨져도 다른 쪽 결과는 받아본다.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # whisper.cpp를 소스에서 빌드하므로 캐시가 없으면 매번 10분 넘게 걸린다.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # whisper-rs가 whisper.cpp를 CMake로 빌드한다. macOS 러너에는 이미 있지만
      # 버전 차이로 깨지는 걸 막으려고 명시해 둔다.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp가 std::filesystem을 쓰는데 이건 macOS 10.15부터다.
          # 유니버설 빌드의 x86_64 타깃은 기본 배포 타깃이 그보다 낮아서
          # "'path' is unavailable: introduced in macOS 10.15"로 컴파일이 막힌다.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          # 자동 업데이트 서명 (updater 아티팩트에 .sig 생성 + latest.json).
          # Apple 코드서명과는 무관하다 — Tauri 자체 업데이트 검증용이다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # --- Apple 정식 서명/공증을 켤 때 ---
          #
          # 아래 여섯 줄을 여기에 추가하고 저장소 Secrets를 채우면 된다.
          #
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # 미리 적어두면 안 된다. 시크릿이 비어 있어도 환경변수 자체는
          # 존재하게 되고, tauri-action이 그걸 보고 인증서를 가져오려다
          # "failed to import keychain certificate"로 빌드가 깨진다.
          # 없는 것보다 빈 플레이스홀더가 더 나쁘다.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'July ${{ github.ref_name }}'
          # macOS 설치 안내는 반드시 맨 위에 둔다. 공증이 없어서 사용자는
          # "손상되었으므로 열 수 없습니다"를 먼저 만나게 되는데, 안내가 아래에
          # 묻혀 있으면 앱이 고장난 줄 알고 그대로 이탈한다.
          releaseBody: |
            회의 녹음을 회의록으로 바꿔주는 데스크톱 앱.
            **음성은 이 기기 밖으로 나가지 않습니다** — 전사는 전부 로컬에서 처리합니다.

            ## 📥 설치

            ### macOS — 반드시 아래 순서대로

            1. `.dmg` 를 내려받아 엽니다
            2. **July.app 을 `응용 프로그램` 폴더로 드래그**합니다
            3. **터미널에 아래 한 줄을 붙여넣고 실행합니다** ← 이 단계를 건너뛰면 안 열립니다

            ```
            xattr -dr com.apple.quarantine /Applications/July.app
            ```

            4. 이제 평소처럼 더블클릭하면 됩니다

            > **왜 이 과정이 필요한가요?**
            > 이 앱은 Apple 공증(notarization)을 받지 않았습니다. 공증에는 Apple Developer
            > 연 $99 계정이 필요합니다. 공증이 없으면 macOS가 인터넷에서 받은 앱에 격리
            > 딱지를 붙이고 **"손상되었으므로 열 수 없습니다"** 라고 표시합니다.
            > 앱이 실제로 손상된 것이 아니라, macOS가 검사할 방법이 없다는 뜻입니다.
            > 위 명령은 그 딱지를 떼는 것이고, 앱 자체는 변경하지 않습니다.

            터미널을 쓰기 어렵다면: 앱을 더블클릭해 경고를 닫은 뒤
            **시스템 설정 → 개인정보 보호 및 보안** → 아래로 스크롤 → **"그래도 열기"** →
            암호 인증. 이후로는 그냥 실행됩니다.

            ### Windows

            `.exe`(NSIS) 또는 `.msi` 를 내려받아 설치합니다.
            SmartScreen 경고가 뜨면 **"추가 정보" → "실행"**.

            ---

            ## 처음 켜면

            준비 화면에서 필요한 모델을 앱 안에서 받습니다. 터미널을 열 일은 없습니다.

            - **음성 인식 모델** (약 1.6GB) — 최초 1회만
            - **요약 모델** — 기기 메모리를 보고 맞는 것을 추천합니다

            요약을 이 기기에서 돌리려면 [Ollama](https://ollama.com) 설치가 필요합니다.
            설치하지 않으면 설정에서 Anthropic API 키를 넣어 쓸 수 있습니다
            (이 경우 녹취 내용이 Anthropic으로 전송됩니다).

            > Windows 빌드는 CPU로만 전사합니다. macOS는 Metal 가속을 써서 훨씬 빠릅니다
            > (M2 Pro 기준 실시간의 13배).
          # 빌드 중에는 초안. 아래 publish 잡이 공개로 바꾼다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 두 플랫폼 빌드가 모두 성공한 뒤에만 릴리스를 공개한다.
  # (matrix 잡이 하나라도 실패하면 needs가 막아서 초안으로 남는다.)
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 공개로 뒤집으면 자산 URL과 latest.json이 그때부터 접근 가능해진다.
      # 업데이터가 보는 건 이 시점 이후의 latest.json이다.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
