name: Release

# v로 시작하는 태그를 push하면 (예: v0.1.0) macOS/Windows 설치파일을 빌드해
# GitHub Release(초안)에 올린다. 초안이므로 확인 후 직접 공개해야 한다.
on:
  push:
    tags:
      - 'v*'
  # 태그를 달기 전에 빌드가 되는지만 보고 싶을 때 수동으로 돌린다.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      # 한쪽 플랫폼이 깨져도 다른 쪽 결과는 받아본다.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # whisper.cpp를 소스에서 빌드하므로 캐시가 없으면 매번 10분 넘게 걸린다.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # whisper-rs가 whisper.cpp를 CMake로 빌드한다. macOS 러너에는 이미 있지만
      # 버전 차이로 깨지는 걸 막으려고 명시해 둔다.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp가 std::filesystem을 쓰는데 이건 macOS 10.15부터다.
          # 유니버설 빌드의 x86_64 타깃은 기본 배포 타깃이 그보다 낮아서
          # "'path' is unavailable: introduced in macOS 10.15"로 컴파일이 막힌다.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          # 자동 업데이트 서명 (updater 아티팩트에 .sig 생성 + latest.json).
          # Apple 코드서명과는 무관하다 — Tauri 자체 업데이트 검증용이다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Apple 정식 서명/공증 (선택) ---
          # 유료 Developer 계정이 생기면 아래 시크릿만 채우면 된다. 비어 있으면
          # tauri.conf.json의 ad-hoc 서명("signingIdentity": "-")으로 빌드된다.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '회의록 ${{ github.ref_name }}'
          releaseBody: |
            회의 녹음을 회의록으로 바꿔주는 데스크톱 앱.
            **음성은 이 기기 밖으로 나가지 않습니다** — 전사는 전부 로컬에서 처리합니다.

            - **macOS**: `.dmg` 를 내려받아 설치
            - **Windows**: `.exe`(NSIS) 또는 `.msi` 를 내려받아 설치

            처음 켜면 음성 인식 모델(약 1.6GB)과 요약 모델을 앱 안에서 받습니다.
            요약을 이 기기에서 돌리려면 [Ollama](https://ollama.com) 설치가 필요하고,
            설치하지 않으면 설정에서 Anthropic API 키를 넣어 쓸 수 있습니다.

            ---
            #### ⚠️ 최초 실행 안내 (Apple 공증이 없어 경고가 뜹니다)

            **macOS** — "악성 소프트웨어 여부를 확인할 수 없습니다" 경고가 뜨면 아래 둘 중 하나로 열어주세요.

            - **터미널 (가장 확실)** — 앱을 `응용 프로그램`으로 옮긴 뒤:
              ```
              xattr -dr com.apple.quarantine /Applications/Meetnote.app
              ```
              그리고 평소처럼 더블클릭.
            - **설정에서 허용** — 앱 더블클릭(경고 닫기) → **시스템 설정 → 개인정보 보호 및 보안** → 아래로 스크롤 → **"그래도 열기"** → 암호 인증. 이후로는 그냥 실행됩니다.

            **Windows** — SmartScreen 경고가 뜨면 **"추가 정보" → "실행"**.

            > Windows 빌드는 CPU로만 전사합니다. macOS는 Metal 가속을 써서 훨씬 빠릅니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
