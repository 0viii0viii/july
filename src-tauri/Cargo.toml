[package]
name = "july"
version = "0.1.11"
description = "회의 녹음을 회의록으로 바꿔주는 데스크톱 앱"
authors = ["0viii0viii"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "july_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5.1"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
cpal = "0.18.1"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
tauri-plugin-dialog = "2.7.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
symphonia = { version = "0.6.0", features = ["aac", "isomp4", "mp3", "alac"] }

# whisper 가속은 플랫폼마다 다르다.
#
# macOS는 Metal을 쓴다 — Apple Silicon에서 실시간 대비 13배가 나온다.
# 그 외 플랫폼은 가속 기능 없이 CPU로만 돈다. Vulkan이나 CUDA를 켤 수도 있지만
# 빌드 머신에 각각 SDK가 필요하고 사용자 GPU도 가려야 해서, 어디서나 되는 쪽을
# 기본으로 뒀다. 느리지만 동작은 한다.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
# 마이크 권한을 명시적으로 요청한다. 이게 없으면 macOS가 입력 장치를 숨겨서
# "마이크 없음"으로 보이고, 권한 창도 시스템 설정 목록도 영영 나타나지 않는다.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

# 화자분리는 Apple Silicon에서만 붙인다.
#
# 다른 데서는 빌드가 안 된다. ort-sys가 x86_64-apple-darwin용 사전 빌드
# 바이너리를 제공하지 않아서 유니버설 빌드의 인텔 아치가 죽고, 윈도우는 MKL
# 정적과 ONNX 정적이 겹치면서 staticlib이 커져 rustc가 내부 패닉을 낸다
# (TryFromIntError(PosOverflow)).
#
# 없는 플랫폼에서는 diarize가 에러를 돌려주고, 호출부는 화자 없이 진행한다.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
speakrs = { version = "0.5", features = ["coreml"] }

